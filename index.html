<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mufa Colony - Build Your Colony. Manage Your Future.</title>
<meta name="description" content="Mufa Colony: game simulasi, strategi, dan manajemen sumber daya di browser. 12 mode + Tutorial, Campaign, tanpa aset eksternal.">
<meta name="theme-color" content="#16272c">
<meta property="og:title" content="Mufa Colony">
<meta property="og:description" content="Bangun koloni, kelola sumber daya, dan hadapi tantangan berbeda di 12 mode permainan.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<noscript><p style="padding:24px;font:16px sans-serif">Mufa Colony membutuhkan JavaScript. Aktifkan JavaScript di browser Anda.</p></noscript>
<header id="topbar">
  <button id="menuBtn" class="sec" title="Menu utama, pilih mode, pencapaian, statistik, pengaturan">☰ Menu</button>
  <h1>Mufa Colony</h1>
  <div id="dayBox">
    <b id="dayLbl"></b>
    <button id="nextDay" title="Proses satu hari: produksi, makan, dan biaya">Hari berikutnya</button>
    <button id="play" class="sec" title="Jalankan hari-hari berikutnya secara otomatis">▶ Jalankan otomatis</button>
    <button id="speed" class="sec" title="Ubah kecepatan mode otomatis">Kecepatan: 1x</button>
  </div>
  <ul id="resources" aria-label="Sumber daya"></ul>
</header>
<main id="game">
  <aside id="side">
    <section class="card" id="cardGoals"><h2>Tujuan</h2><div id="goals"></div></section>
    <section class="card" id="cardInfo"><h2>Info bangunan</h2><div id="info" aria-live="polite"></div></section>
    <section class="card" id="cardReport"><h2>Laporan harian <button id="openReport" class="mini" hidden>Detail</button></h2><div id="report"></div></section>
  </aside>
  <section id="mapWrap"><div id="map" role="grid" aria-label="Peta koloni" tabindex="0"></div></section>
  <aside id="panel"><div id="tools"></div></aside>
</main>
<div id="modal" hidden><div class="box" role="dialog" aria-modal="true"></div></div>
<footer id="toast" role="status"></footer>
<script src="data/buildings.js"></script>
<script src="data/campaign-levels.js"></script>
<script src="js/config.js"></script>
<script src="js/state.js"></script>
<script src="js/map.js"></script>
<script src="js/buildings.js"></script>
<script src="js/store.js"></script>
<script src="js/sprites.js"></script>
<script src="js/economy.js"></script>
<script src="js/population.js"></script>
<script src="js/simulation.js"></script>
<script src="js/events.js"></script>
<script src="js/scoring.js"></script>
<script src="js/renderer.js"></script>
<script src="js/ui.js"></script>
<script src="js/dialogs.js"></script>
<script src="js/achievements.js"></script>
<script src="modes/classic.js"></script>
<script src="modes/tutorial.js"></script>
<script src="modes/speed-builder.js"></script>
<script src="modes/survival.js"></script>
<script src="modes/economic-empire.js"></script>
<script src="modes/population-boom.js"></script>
<script src="modes/tiny-territory.js"></script>
<script src="modes/green-colony.js"></script>
<script src="modes/disaster-response.js"></script>
<script src="modes/frontier-explorer.js"></script>
<script src="modes/energy-crisis.js"></script>
<script src="modes/endless.js"></script>
<script src="modes/campaign.js"></script>
<script src="js/screens.js"></script>
<script src="js/main.js"></script>
<script src="js/day.js"></script>
</body>
</html>
